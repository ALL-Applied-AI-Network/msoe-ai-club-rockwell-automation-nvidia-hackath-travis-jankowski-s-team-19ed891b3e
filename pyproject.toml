[project]
name = "smartgrasp"
version = "0.1.0"
description = "Synthetic-data-trained cube grasping for the FANUC ER-4iA cell at UWM CSI"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "scipy>=1.14",
    "ultralytics==8.4.178",
    # ONNX export + CPU inference; listed explicitly because uv venvs have no pip
    # for Ultralytics to auto-install them at export time.
    "onnx>=1.18",
    "onnxslim>=0.1.98",
    "onnxruntime>=1.20",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartgrasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
